# XcodeGen spec. Generate the project with `xcodegen generate` (brew install xcodegen).
# The .xcodeproj is git-ignored on purpose: this file is the source of truth.
name: A320Overhead
options:
  bundleIdPrefix: com.gondbustamante
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# Signing lives in Signing.xcconfig + a git-ignored Local.xcconfig with your Team ID,
# so regenerating the project never loses it. Do not set DEVELOPMENT_TEAM below:
# build settings here override the xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  XPlaneKit:
    path: Packages/XPlaneKit

targets:
  A320Overhead:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: A320Overhead
      # Mapping JSON is bundled as a folder reference so edits need no project changes.
      - path: mapping
        type: folder
        buildPhase: resources
    dependencies:
      - package: XPlaneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gondbustamante.a320overhead
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: A320Overhead/Info.plist
      properties:
        CFBundleDisplayName: A320 Overhead
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required on iOS 14+ to talk to devices on the local network.
        NSLocalNetworkUsageDescription: "La app se conecta a X-Plane en tu red local para leer y mover los controles del avión."
        # Plain HTTP/WS to the PC. IP addresses are already exempt from ATS; this also covers names like pc.local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
